services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: onboarding-postgres
    environment:
      POSTGRES_DB: onboarding
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "5433:5432"
    volumes:
      - onboarding_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding -d onboarding"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  onboarding_pgdata:
